name: Fetch Gold Price Daily

"on":
  schedule:
    - cron: '0 0 * * *'  # 毎朝9時（日本時間 JST = UTC+9）
  workflow_dispatch:

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
    steps:
      - name: Fetch Tanaka kaitori price and save to Firestore
        run: |
          node -e "
          const https = require('https');

          // 田中貴金属 貴金属価格情報ページから金の1g買取単価を取得
          // /commodity/kaitori/ は廃止。現在は /commodity/souba/index.php に統合
          function fetchKaitoriPrice() {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'gold.tanaka.co.jp',
                path: '/commodity/souba/index.php',
                method: 'GET',
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Accept-Language': 'ja,en-US;q=0.9,en;q=0.8',
                  'Accept-Encoding': 'identity'
                }
              };

              https.get(options, (res) => {
                if (res.statusCode === 301 || res.statusCode === 302) {
                  return reject(new Error('Redirect: ' + res.headers.location));
                }
                if (res.statusCode !== 200) {
                  return reject(new Error('HTTP ' + res.statusCode));
                }

                const chunks = [];
                res.on('data', chunk => chunks.push(chunk));
                res.on('end', () => {
                  const html = Buffer.concat(chunks).toString('utf8');
                  console.log('HTML length:', html.length);

                  // デバッグ: 価格テーブルのテキストを常時出力
                  const priceTable = html.match(/<table[^>]*id=[\"']metal_price[\"'][^>]*>[\s\S]*?<\/table>/);
                  if (priceTable) {
                    const tableText = priceTable[0].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                    console.log('Price table text:', tableText);
                  } else {
                    const textOnly = html
                      .replace(/<style[\s\S]*?<\/style>/gi, '')
                      .replace(/<script[\s\S]*?<\/script>/gi, '')
                      .replace(/<[^>]+>/g, ' ')
                      .replace(/\s+/g, ' ')
                      .trim();
                    console.log('Page text (debug):', textOnly.slice(0, 3000));
                  }

                  // パターン1: <tr class="gold"> の <td class="purchase_tax"> から買取価格を取得
                  // 例: <tr class="gold"><td class="purchase_tax">25,012 円</td>
                  const goldRow = html.match(/<tr[^>]*class=[\"']gold[\"'][^>]*>([\s\S]*?)<\/tr>/);
                  if (goldRow) {
                    const purchaseTd = goldRow[1].match(/<td[^>]*class=[\"']purchase_tax[\"'][^>]*>\s*([0-9,]+)\s*円/);
                    if (purchaseTd) {
                      const price = parseInt(purchaseTd[1].replace(/,/g, ''));
                      if (price >= 5000 && price <= 999999) {
                        console.log('Pattern1 matched:', price);
                        return resolve(price);
                      }
                    }
                  }

                  // パターン2: purchase_tax セルを直接検索（フォールバック）
                  const purchaseCells = html.match(/<td[^>]*class=[\"']purchase_tax[\"'][^>]*>\s*([0-9,]+)\s*円/g) || [];
                  for (const cell of purchaseCells) {
                    const m = cell.match(/([0-9,]+)\s*円/);
                    if (m) {
                      const price = parseInt(m[1].replace(/,/g, ''));
                      if (price >= 5000 && price <= 999999) {
                        console.log('Pattern2 matched:', price);
                        return resolve(price);
                      }
                    }
                  }

                  reject(new Error('金の買取価格が見つかりませんでした'));
                });
              }).on('error', (err) => reject(err));
            });
          }

          async function saveToFirestore(price) {
            const today = new Date().toISOString().split('T')[0];
            const projectId = process.env.FIREBASE_PROJECT_ID;
            const apiKey = process.env.FIREBASE_API_KEY;
            const url = 'https://firestore.googleapis.com/v1/projects/' + projectId +
              '/databases/(default)/documents/gold_prices/' + today + '?key=' + apiKey;
            const body = JSON.stringify({
              fields: {
                date:      { stringValue: today },
                price:     { integerValue: price.toString() },
                source:    { stringValue: 'tanaka_kaitori' },
                fetchedAt: { stringValue: new Date().toISOString() }
              }
            });
            return new Promise((resolve, reject) => {
              const req = https.request(url, {
                method: 'PATCH',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body)
                }
              }, (res) => {
                let d = '';
                res.on('data', chunk => d += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    console.log('Firestore saved:', today, price + '円/g');
                    resolve();
                  } else {
                    reject(new Error('Firestore HTTP ' + res.statusCode + ': ' + d));
                  }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          (async () => {
            try {
              console.log('田中貴金属 買取価格を取得中...');
              const price = await fetchKaitoriPrice();
              console.log('取得価格:', price, '円/g');
              await saveToFirestore(price);
              console.log('完了');
            } catch(e) {
              console.error('エラー:', e.message || String(e));
              process.exit(1);
            }
          })();
          "
