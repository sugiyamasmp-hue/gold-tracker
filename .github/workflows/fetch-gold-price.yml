name: Fetch Gold Price Daily

"on":
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
    steps:
      - name: Fetch gold price and save to Firestore
        run: |
          node -e "
          const https = require('https');

          function fetchGoldPrice() {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'gold.tanaka.co.jp',
                path: '/commodity/souba/',
                method: 'GET',
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
              };
              https.get(options, (res) => {
                if (res.statusCode !== 200) return reject('HTTP ' + res.statusCode);
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  const goldRow = data.match(/<td[^>]*class="metal_name"[^>]*>金<\/td>[\s\S]*?<\/tr>/);
                  if (!goldRow) return reject('Gold price row not found');
                  const priceMatch = goldRow[0].match(/class="retail_tax"[^>]*>([0-9,]+)\s*円/);
                  if (priceMatch) {
                    const price = parseInt(priceMatch[1].replace(/,/g, ''));
                    if (price > 1000 && price < 999999) return resolve(price);
                    else return reject('Invalid price: ' + price);
                  }
                  reject('Price not found');
                });
              }).on('error', reject);
            });
          }

          async function saveToFirestore(price) {
            const today = new Date().toISOString().split('T')[0];
            const projectId = process.env.FIREBASE_PROJECT_ID;
            const apiKey = process.env.FIREBASE_API_KEY;
            const url = 'https://firestore.googleapis.com/v1/projects/' + projectId + '/databases/(default)/documents/gold_prices/' + today + '?key=' + apiKey;
            const body = JSON.stringify({
              fields: {
                date: { stringValue: today },
                price: { integerValue: price.toString() },
                source: { stringValue: 'tanaka_kikinzoku' },
                fetchedAt: { stringValue: new Date().toISOString() }
              }
            });
            return new Promise((resolve, reject) => {
              const req = https.request(url, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) } }, (res) => {
                let d = '';
                res.on('data', chunk => d += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) { console.log('Saved!'); resolve(); }
                  else reject('Firestore HTTP ' + res.statusCode + ': ' + d);
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          (async () => {
            try {
              console.log('Fetching gold price...');
              const price = await fetchGoldPrice();
              console.log('Price:', price, 'JPY/g');
              await saveToFirestore(price);
              console.log('Done!');
            } catch(e) {
              console.error('Error:', e);
              process.exit(1);
            }
          })();
          "
