name: Keep Repository Active

"on":
  schedule:
    - cron: '0 0 1 * *'  # 毎月1日 0:00 UTC に実行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dummy commit to keep scheduled workflows active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/keep-alive
          echo "Last keep-alive run: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/keep-alive/last-run.txt
          git add .github/keep-alive/last-run.txt
          git commit -m "chore: keep-alive dummy commit to prevent workflow auto-disable"
          git push
