name: Import Historical Gold Prices

on:
  workflow_dispatch:  # 手動で1回だけ実行

jobs:
  import-history:
    runs-on: ubuntu-latest
    steps:
      - name: Import historical gold prices to Firestore
        run: |
          node -e "
          const https = require('https');

          // 田中貴金属の過去データページからスクレイピング
          function fetchHistoricalData() {
            return new Promise((resolve, reject) => {
              // 過去の月別データページ
              const years = [2023, 2024, 2025, 2026];
              const results = [];
              let pending = 0;

              // 各月のデータを取得
              const months = [];
              for (const year of years) {
                for (let month = 1; month <= 12; month++) {
                  const now = new Date();
                  if (new Date(year, month - 1) <= now) {
                    months.push({ year, month });
                  }
                }
              }

              // シンプルに直近データを生成（田中貴金属の実際の価格に近い推定値）
              // 実際のデータはGitHub Actions実行時にスクレイピングで取得
              const basePrice = 12000;
              const data = [];
              const start = new Date('2023-01-01');
              const end = new Date();

              for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                // 週末はスキップ（市場休場）
                if (d.getDay() === 0 || d.getDay() === 6) continue;
                const dateStr = d.toISOString().split('T')[0];
                data.push(dateStr);
              }

              resolve(data);
            });
          }

          // 田中貴金属の実際の過去価格をスクレイピング
          function fetchPriceForDate(year, month) {
            return new Promise((resolve) => {
              const path = '/commodity/souba/y' + year + ('0' + month).slice(-2) + '.html';
              const options = {
                hostname: 'gold.tanaka.co.jp',
                path: path,
                method: 'GET',
                headers: { 'User-Agent': 'Mozilla/5.0' }
              };
              https.get(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  // 日付と価格のペアを抽出
                  const rows = [];
                  const regex = /(\d{1,2})日[\s\S]*?(\d{1,2},\d{3})/g;
                  let match;
                  while ((match = regex.exec(data)) !== null) {
                    const day = parseInt(match[1]);
                    const price = parseInt(match[2].replace(',', ''));
                    if (price > 1000 && price < 100000) {
                      const dateStr = year + '-' + ('0' + month).slice(-2) + '-' + ('0' + day).slice(-2);
                      rows.push({ date: dateStr, price });
                    }
                  }
                  resolve(rows);
                });
              }).on('error', () => resolve([]));
            });
          }

          async function saveToFirestore(date, price) {
            const projectId = '${{ secrets.FIREBASE_PROJECT_ID }}';
            const url = 'https://firestore.googleapis.com/v1/projects/' + projectId + '/databases/(default)/documents/gold_prices/' + date + '?key=' + '${{ secrets.FIREBASE_API_KEY }}';
            const body = JSON.stringify({
              fields: {
                date: { stringValue: date },
                price: { integerValue: price.toString() },
                source: { stringValue: 'tanaka_kikinzoku_history' },
                fetchedAt: { stringValue: new Date().toISOString() }
              }
            });

            return new Promise((resolve) => {
              const urlObj = new URL(url);
              const options = {
                hostname: urlObj.hostname,
                path: urlObj.pathname + urlObj.search,
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              };
              const req = https.request(options, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(res.statusCode === 200));
              });
              req.on('error', () => resolve(false));
              req.write(body);
              req.end();
            });
          }

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          (async () => {
            console.log('Starting historical data import...');
            const years = [2023, 2024, 2025, 2026];
            let total = 0;
            let success = 0;

            for (const year of years) {
              for (let month = 1; month <= 12; month++) {
                const now = new Date();
                if (new Date(year, month - 1) > now) break;

                console.log('Fetching ' + year + '/' + month + '...');
                const rows = await fetchPriceForDate(year, month);
                console.log('Found ' + rows.length + ' records');

                for (const row of rows) {
                  const ok = await saveToFirestore(row.date, row.price);
                  if (ok) success++;
                  total++;
                  await sleep(100); // Firestoreレート制限対策
                }
                await sleep(500);
              }
            }

            console.log('Import complete: ' + success + '/' + total + ' records saved');
          })();
          "
