name: Import Historical Gold Prices

"on":
  workflow_dispatch:

jobs:
  import-history:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
    steps:
      - name: Import historical gold prices to Firestore
        run: |
          node -e "
          const https = require('https');

          const projectId = process.env.FIREBASE_PROJECT_ID;
          const apiKey = process.env.FIREBASE_API_KEY;

          function fetchPriceForDate(year, month) {
            return new Promise((resolve) => {
              const monthStr = ('0' + month).slice(-2);
              const path = '/commodity/souba/y' + year + monthStr + '.html';
              const options = {
                hostname: 'gold.tanaka.co.jp',
                path: path,
                method: 'GET',
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36' }
              };
              https.get(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  console.log('Status:', res.statusCode, 'Size:', data.length, 'bytes');
                  if (data.length < 100) { resolve([]); return; }
                  
                  const rows = [];
                  
                  // パターン1: <td>数字</td> の形式
                  const tdMatches = data.match(/<td[^>]*>(\d{1,2})<\/td>[\s\S]{0,500}?(\d{2},\d{3})/g);
                  if (tdMatches && tdMatches.length > 0) {
                    console.log('Pattern1 matches:', tdMatches.length);
                    for (const m of tdMatches) {
                      const dayM = m.match(/<td[^>]*>(\d{1,2})<\/td>/);
                      const priceM = m.match(/(\d{2},\d{3})/);
                      if (dayM && priceM) {
                        const day = parseInt(dayM[1]);
                        const price = parseInt(priceM[1].replace(',', ''));
                        if (day >= 1 && day <= 31 && price > 1000 && price < 200000) {
                          const dateStr = year + '-' + monthStr + '-' + ('0' + day).slice(-2);
                          rows.push({ date: dateStr, price });
                        }
                      }
                    }
                  }
                  
                  // パターン2: 数字のみの価格を幅広く探す
                  if (rows.length === 0) {
                    const allPrices = data.match(/\b([1-9]\d{4,5})\b/g);
                    if (allPrices) {
                      console.log('Pattern2 raw prices found:', allPrices.slice(0, 5));
                    }
                    
                    // カンマ区切り価格
                    const commaprices = [...data.matchAll(/(\d{1,3}),(\d{3})/g)];
                    for (const m of commaprices) {
                      const price = parseInt(m[1] + m[2]);
                      if (price > 5000 && price < 200000) {
                        console.log('Comma price found:', price);
                        break;
                      }
                    }
                  }
                  
                  // パターン3: HTMLをダンプして確認
                  if (rows.length === 0) {
                    const snippet = data.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').substring(0, 500);
                    console.log('HTML snippet:', snippet);
                  }
                  
                  resolve(rows);
                });
              }).on('error', (e) => { console.log('Error:', e.message); resolve([]); });
            });
          }

          async function saveToFirestore(date, price) {
            const url = 'https://firestore.googleapis.com/v1/projects/' + projectId + '/databases/(default)/documents/gold_prices/' + date + '?key=' + apiKey;
            const body = JSON.stringify({
              fields: {
                date: { stringValue: date },
                price: { integerValue: price.toString() },
                source: { stringValue: 'tanaka_history' },
                fetchedAt: { stringValue: new Date().toISOString() }
              }
            });
            return new Promise((resolve) => {
              const req = https.request(url, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) } }, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(res.statusCode === 200));
              });
              req.on('error', () => resolve(false));
              req.write(body);
              req.end();
            });
          }

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          (async () => {
            console.log('Starting import...');
            // まず最新月だけテスト
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            console.log('Testing with ' + year + '/' + month);
            const rows = await fetchPriceForDate(year, month);
            console.log('Test result:', rows.length, 'records');
            if (rows.length > 0) console.log('Sample:', rows[0]);
            
            // 全期間実行
            const years = [2023, 2024, 2025, 2026];
            let total = 0, success = 0;
            for (const y of years) {
              for (let m = 1; m <= 12; m++) {
                if (new Date(y, m - 1) > new Date()) break;
                const r = await fetchPriceForDate(y, m);
                console.log(y + '/' + m + ': ' + r.length + ' records');
                for (const row of r) {
                  const ok = await saveToFirestore(row.date, row.price);
                  if (ok) success++;
                  total++;
                  await sleep(100);
                }
                await sleep(300);
              }
            }
            console.log('Done: ' + success + '/' + total + ' saved');
          })();
          "
