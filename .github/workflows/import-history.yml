name: Import Historical Gold Prices

"on":
  workflow_dispatch:

jobs:
  import-history:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
    steps:
      - name: Import historical gold prices to Firestore
        run: |
          node -e "
          const https = require('https');

          const projectId = process.env.FIREBASE_PROJECT_ID;
          const apiKey = process.env.FIREBASE_API_KEY;

          function fetchYearData(year) {
            return new Promise((resolve) => {
              const options = {
                hostname: 'gold.tanaka.co.jp',
                path: '/commodity/souba/d-archive-gold.php?year=' + year,
                method: 'GET',
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
              };
              https.get(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  console.log('Year ' + year + ' status:', res.statusCode, 'size:', data.length);
                  const rows = [];

                  // テーブルの行を解析: | 1日 | 10,665 | 10,694 | ... |
                  // 各行は日付(1〜31日)、各列は月(1〜12月)
                  const tableMatch = data.match(/<table[\s\S]*?<\/table>/i);
                  if (!tableMatch) { console.log('No table found'); resolve([]); return; }

                  const table = tableMatch[0];
                  const trMatches = table.match(/<tr[\s\S]*?<\/tr>/gi);
                  if (!trMatches) { resolve([]); return; }

                  for (const tr of trMatches) {
                    // 日付セルを取得 (例: 1日, 2日, ...)
                    const dayMatch = tr.match(/>(\d{1,2})日</);
                    if (!dayMatch) continue;
                    const day = parseInt(dayMatch[1]);

                    // 各tdの価格を取得
                    const tdMatches = tr.match(/<td[^>]*>([\s\S]*?)<\/td>/gi);
                    if (!tdMatches) continue;

                    let monthIndex = 0;
                    for (const td of tdMatches) {
                      const text = td.replace(/<[^>]+>/g, '').trim();
                      const priceMatch = text.match(/^(\d{1,3}),(\d{3})$/);
                      if (priceMatch) {
                        const price = parseInt(priceMatch[1] + priceMatch[2]);
                        const month = monthIndex + 1;
                        if (price > 1000 && price < 200000 && month >= 1 && month <= 12) {
                          const dateStr = year + '-' + ('0' + month).slice(-2) + '-' + ('0' + day).slice(-2);
                          rows.push({ date: dateStr, price });
                        }
                        monthIndex++;
                      } else if (text === '-' || text === '') {
                        monthIndex++;
                      }
                    }
                  }

                  console.log('Year ' + year + ': found ' + rows.length + ' records');
                  if (rows.length > 0) console.log('Sample:', rows[0]);
                  resolve(rows);
                });
              }).on('error', (e) => { console.log('Error:', e.message); resolve([]); });
            });
          }

          async function saveToFirestore(date, price) {
            const url = 'https://firestore.googleapis.com/v1/projects/' + projectId + '/databases/(default)/documents/gold_prices/' + date + '?key=' + apiKey;
            const body = JSON.stringify({
              fields: {
                date: { stringValue: date },
                price: { integerValue: price.toString() },
                source: { stringValue: 'tanaka_history' },
                fetchedAt: { stringValue: new Date().toISOString() }
              }
            });
            return new Promise((resolve) => {
              const req = https.request(url, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) } }, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(res.statusCode === 200));
              });
              req.on('error', () => resolve(false));
              req.write(body);
              req.end();
            });
          }

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          (async () => {
            console.log('Starting import...');
            const years = [2023, 2024, 2025, 2026];
            let total = 0, success = 0;

            for (const year of years) {
              const rows = await fetchYearData(year);
              for (const row of rows) {
                const ok = await saveToFirestore(row.date, row.price);
                if (ok) success++;
                total++;
                await sleep(80);
              }
              await sleep(500);
            }
            console.log('Done: ' + success + '/' + total + ' saved');
          })();
          "
